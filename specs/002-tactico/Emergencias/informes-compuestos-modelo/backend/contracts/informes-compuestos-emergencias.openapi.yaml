openapi: 3.0.3

info:
  title: Informes compuestos de Emergencias sobre el modelo analítico
  version: "1.0.0"
  description: |
    Endpoints de **solo lectura** de los informes agregados de Emergencias (OT21–OT25),
    resueltos con una consulta sobre el modelo analítico.

    **Alcance de esta versión: 13 endpoints** — los 10 informes nuevos y los 3 que se migran por
    tener defectos conocidos. Los 13 informes correctos que ya sirve `informes-tacticos-agregados`
    **no se duplican aquí**; ver `plan.md`.

    ## Reglas transversales

    - **Solo lectura.** Ningún endpoint escribe.
    - **Sin dato sensible**, para ningún rol: ni coordenadas, ni identidad de personas, ni texto
      libre interno. La exclusión no la levanta la autoridad departamental.
    - **Sin dato ≠ cero.** Un porcentaje sin denominador se devuelve `null`, nunca `0`.
    - **Todo porcentaje viene con su denominador**, para que la fracción sea comprobable.
    - **Un período sin datos devuelve `data: []`**, que es distinto de una fila de ceros.

servers:
  - url: /api/v1

tags:
  - name: OT21 Registro
  - name: OT22 Despacho
  - name: OT23 Seguimiento
  - name: OT24 Evidencia
  - name: OT25 Cierre

paths:
  /informes-tacticos/emergencias/completitud-campos-criticos:
    get:
      tags: [OT21 Registro]
      summary: Completitud de campos críticos (migrado — corrige defecto)
      description: |
        ⚠️ **Sustituye al endpoint equivalente que sirve desde el sistema operativo**, cuya condición
        de completitud es **siempre cierta**: compara contra nulidad y el origen usa valores
        centinela. En el modelo la ausencia es ausencia, así que la cifra puede bajar del 100 %.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Completitud por período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaInforme'
              example:
                data:
                  - periodo: "2026-08-01"
                    casos: 42
                    completos: 40
                    pct_completitud: 0.9524
                meta:
                  periodo: { desde: "2026-08-01", hasta: "2026-08-31" }
                  filtros: {}
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/ratio-demanda-capacidad:
    get:
      tags: [OT22 Despacho]
      summary: Ratio demanda / capacidad por condado (migrado — corrige defecto)
      description: |
        ⚠️ **`unidades_vigentes` es la capacidad del período consultado**, no la flota de hoy. El
        endpoint anterior usa `activo = true`, así que un ratio de hace tres meses se calculaba
        contra unidades que quizá no existían entonces.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Ratio por condado y período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
              example:
                data:
                  - periodo: "2026-08"
                    condado: "Cuauhtemoc"
                    casos: 310
                    unidades_vigentes: 12
                    ratio: 25.83
                meta:
                  periodo: { desde: "2026-08-01", hasta: "2026-08-31" }
                  filtros: {}
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/perdida-senal:
    get:
      tags: [OT23 Seguimiento]
      summary: Pérdida de señal (migrado — corrige defecto)
      description: |
        ⚠️ **Considera todas las posiciones del período.** El flujo anterior analizaba **10 000 de
        59 045** —el 16,9 %— por un truncamiento silencioso, y publicaba el resultado como completo.
        Las cifras de este endpoint serán **mayores**: eso es el arreglo, no una regresión.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - name: umbral_seg
          in: query
          schema: { type: integer, default: 60, minimum: 1 }
          description: Segundos sin reportar a partir de los cuales se considera hueco.
      responses:
        '200':
          description: Huecos detectados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/primer-intento:
    get:
      tags: [OT22 Despacho]
      summary: Despachos resueltos al primer intento (nuevo — indicador BSC, meta ≥90 %)
      description: |
        Solo es calculable con **grano de intento**: los intentos con ordinal 1 y desenlace
        confirmado. Con grano de caso, los intentos fallidos desaparecen de las cifras.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Resolución al primer intento por período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/desviacion-llegada:
    get:
      tags: [OT23 Seguimiento]
      summary: Desviación de llegada frente a la referencia histórica (nuevo)
      description: |
        ⚠️ **`segundos_referencia` es un valor derivado del histórico, no un compromiso operativo.**
        El sistema no guarda ninguna estimación de llegada: la referencia es la **mediana** de los
        despachos comparables —mismo condado y severidad— en una ventana **anterior** al despacho
        medido.

        Si no hay al menos `muestra_minima` llegadas comparables, `segundos_referencia` y
        `desviacion_mediana` se devuelven **`null`**. Nunca `0`: cero significaría «llegó justo a
        tiempo», que es lo contrario de «no sabemos qué esperar».
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - name: ventana_dias
          in: query
          schema: { type: integer, default: 90, minimum: 7 }
        - name: muestra_minima
          in: query
          schema: { type: integer, default: 5, minimum: 1 }
      responses:
        '200':
          description: Desviación por unidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
              example:
                data:
                  - periodo: "2026-08"
                    unidad: "ABC-123"
                    llegadas_medidas: 24
                    segundos_referencia: 640
                    segundos_reales_mediana: 712
                    desviacion_mediana: 72
                  - periodo: "2026-08"
                    unidad: "XYZ-999"
                    llegadas_medidas: 2
                    segundos_referencia: null
                    segundos_reales_mediana: 501
                    desviacion_mediana: null
                meta:
                  periodo: { desde: "2026-08-01", hasta: "2026-08-31" }
                  filtros: { ventana_dias: 90, muestra_minima: 5 }
                  nota_referencia: "Valor derivado del histórico; no es un objetivo ni un SLA."
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/cobertura-evidencia:
    get:
      tags: [OT24 Evidencia]
      summary: Cobertura de evidencia por severidad y región (nuevo)
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Cobertura por severidad y condado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/latencia-sincronizacion:
    get:
      tags: [OT24 Evidencia]
      summary: Latencia de sincronización offline (nuevo)
      description: |
        Una evidencia **aún sin sincronizar** tiene latencia `null`, no infinita ni cero. Se cuenta
        aparte en `pendientes`.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Latencia por período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/completitud-enriquecimiento:
    get:
      tags: [OT24 Evidencia]
      summary: Completitud del enriquecimiento (nuevo — indicador BSC)
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Enriquecimiento por período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/volumen-evidencia-por-unidad:
    get:
      tags: [OT24 Evidencia]
      summary: Volumen de evidencia por unidad (nuevo)
      description: |
        ⚠️ **Sin desglose por técnico de campo.** El catálogo lo pedía, pero es identidad de una
        persona y la exclusión no admite excepciones. El informe responde «qué unidades documentan
        bien», no «qué personas».
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Volumen por unidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/escaladas-severidad:
    get:
      tags: [OT24 Evidencia]
      summary: Escaladas de severidad originadas en sitio (nuevo)
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Escaladas por período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/distribucion-resultados:
    get:
      tags: [OT25 Cierre]
      summary: Distribución de resultados y calificación media (nuevo)
      description: |
        La calificación ausente **no es un cero**: sería la peor nota posible. Los casos sin
        calificar quedan fuera del promedio y se cuentan aparte.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Distribución por severidad y condado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/envejecimiento-cartera:
    get:
      tags: [OT25 Cierre]
      summary: Envejecimiento de la cartera de casos abiertos (nuevo)
      description: |
        Un caso abierto **no tiene fecha de cierre**. Si el modelo le pusiera la fecha de carga,
        todos los casos abiertos aparecerían cerrados y esta cartera saldría vacía.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - name: tramos_dias
          in: query
          schema: { type: string, default: "1,3,7,30" }
          description: Cortes de antigüedad, en días, separados por coma.
      responses:
        '200':
          description: Casos abiertos por tramo de antigüedad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /informes-tacticos/emergencias/retiros-forzados-por-proveedor:
    get:
      tags: [OT25 Cierre]
      summary: Retiros forzados frente a finalizaciones normales, por proveedor (nuevo)
      description: |
        ⚠️ Agrupa por el proveedor **vigente cuando ocurrió el despacho**, no por el actual. Un
        cambio de proveedor no reescribe el desempeño anterior.
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Retiros por proveedor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInforme' }
        '403': { $ref: '#/components/responses/SinPermiso' }

components:
  parameters:
    Desde:
      name: desde
      in: query
      schema: { type: string, format: date }
      description: Inicio del período, inclusive. Por defecto, hace 30 días.
    Hasta:
      name: hasta
      in: query
      schema: { type: string, format: date }
      description: Fin del período, inclusive. Por defecto, hoy.

  responses:
    SinPermiso:
      description: |
        El solicitante no tiene autoridad ni papel operativo en Emergencias.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    RespuestaInforme:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: |
            Filas agregadas. **Vacío** si el período no tiene datos — distinto de una fila de ceros.
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          properties:
            periodo:
              type: object
              properties:
                desde: { type: string, format: date }
                hasta: { type: string, format: date }
            filtros:
              type: object
              additionalProperties: true

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string }
            mensaje: { type: string }
