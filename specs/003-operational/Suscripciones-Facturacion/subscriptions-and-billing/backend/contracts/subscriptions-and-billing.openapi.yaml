openapi: 3.0.3
info:
  title: Suscripciones y Facturación — TSI
  version: "1.0.0"
  description: >
    Contrato REST contract-first para RF-SUSF-001…003, 006, 009, 010 y regularización.
    RF-004/005/007 (batch)/008 son jobs sin endpoint público — ver research.md Decision 1.
    Envelope y errores según api-standards.md. Auth: Bearer JWT.
    RF-SUSF-001 (POST/PATCH planes): rol JWT `DirectorEstrategia` (Session 2026-07-30);
    Administrador conserva aprobaciones de downgrade y consulta de facturas.
servers:
  - url: /api/v1

tags:
  - name: Suscripcion
  - name: Planes
  - name: MetodoPago
  - name: CambioPlan
  - name: Facturas

paths:
  /suscripciones:
    post:
      summary: Alta / contratación inicial (CU-O111)
      operationId: altaSuscripcion
      tags: [Suscripcion]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AltaSuscripcionRequest"
      responses:
        "201":
          description: Suscripción Activa creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuscripcionEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Ya existe suscripción activo=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /suscripciones/mia:
    get:
      summary: Suscripción vigente del Proveedor autenticado
      operationId: obtenerMiSuscripcion
      tags: [Suscripcion]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Suscripción + flags de acceso (RN-017)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuscripcionDetalleEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /suscripciones/mia/cancelar:
    post:
      summary: Cancelar suscripción (CU-O110)
      operationId: cancelarSuscripcion
      tags: [Suscripcion]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivocancelacion]
              properties:
                motivocancelacion: { type: string, minLength: 1 }
      responses:
        "200":
          description: Estado Cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuscripcionEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /suscripciones/mia/reintentar-cobro:
    post:
      summary: Reintentar cobro en mora sin cambiar método (RN-028)
      operationId: reintentarCobro
      tags: [Suscripcion]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Resultado de regularización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegularizacionEnvelope"
        "409":
          description: No hay factura Fallida vigente / no Suspendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /suscripciones/metodos-pago:
    get:
      summary: Listar métodos de pago del cliente (incluye históricos)
      operationId: listarMetodosPago
      tags: [MetodoPago]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetodoPagoListEnvelope"
    post:
      summary: Alta o reemplazo del método principal (CU-O101)
      operationId: registrarMetodoPago
      tags: [MetodoPago]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetodoPagoRequest"
      responses:
        "201":
          description: Método activo creado (puede disparar regularización)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetodoPagoEnvelope"

  /suscripciones/solicitudes-cambio-plan:
    get:
      summary: Listar solicitudes del cliente (o todas si Admin + filtro)
      operationId: listarSolicitudesCambioPlan
      tags: [CambioPlan]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [Pendiente, Aprobada, Rechazada]
        - name: idcliente
          in: query
          description: Solo Administrador
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudListEnvelope"
    post:
      summary: Solicitar cambio de plan (CU-O104)
      operationId: solicitarCambioPlan
      tags: [CambioPlan]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCambioPlanRequest"
      responses:
        "201":
          description: Solicitud creada (Aprobada si upgrade; Pendiente si downgrade)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudEnvelope"
        "409":
          description: Ya existe Pendiente (RN-023) o suscripción no Activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /suscripciones/solicitudes-cambio-plan/{idsolicitud}/aprobar:
    post:
      summary: Aprobar downgrade (Administrador)
      operationId: aprobarCambioPlan
      tags: [CambioPlan]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdSolicitud"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Solicitud Aprobada; plan actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudEnvelope"

  /suscripciones/solicitudes-cambio-plan/{idsolicitud}/rechazar:
    post:
      summary: Rechazar downgrade (Administrador)
      operationId: rechazarCambioPlan
      tags: [CambioPlan]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdSolicitud"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo_rechazo]
              properties:
                motivo_rechazo: { type: string, minLength: 1 }
      responses:
        "200":
          description: Solicitud Rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudEnvelope"

  /suscripciones/planes:
    get:
      summary: Catálogo de planes (activos para Proveedor; todos para Admin)
      operationId: listarPlanes
      tags: [Planes]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: solo_activos
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Lista de planes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanListEnvelope"
    post:
      summary: Crear plan (CU-O106, Director de Estrategia / rol JWT DirectorEstrategia)
      operationId: crearPlan
      tags: [Planes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Plan creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEnvelope"

  /suscripciones/planes/{idplan}:
    patch:
      summary: Editar o desactivar plan (Director de Estrategia / rol JWT DirectorEstrategia)
      operationId: actualizarPlan
      tags: [Planes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPlan"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanPatchRequest"
      responses:
        "200":
          description: Plan actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEnvelope"

  /suscripciones/facturas:
    get:
      summary: Historial de facturas (CU-O108)
      operationId: listarFacturas
      tags: [Facturas]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: idcliente
          in: query
          description: Obligatorio/permitido solo para Administrador; Proveedor ignora y usa el propio
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Facturas ordenadas por fecha_emision desc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturaListEnvelope"

  /suscripciones/facturas/{id_factura}:
    get:
      summary: Detalle de factura
      operationId: obtenerFactura
      tags: [Facturas]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id_factura
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detalle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacturaEnvelope"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdSolicitud:
      name: idsolicitud
      in: path
      required: true
      schema: { type: integer }
    IdPlan:
      name: idplan
      in: path
      required: true
      schema: { type: integer }

  responses:
    Error:
      description: Error estándar
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      required: [error, detail, code]
      properties:
        error: { type: string }
        detail: { type: string }
        code: { type: string }

    PaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            next_cursor: { type: string, nullable: true }
            limit: { type: integer }

    AltaSuscripcionRequest:
      type: object
      required: [idplan]
      properties:
        idplan: { type: integer }
        renovacionautomatica: { type: boolean, default: true }

    Suscripcion:
      type: object
      properties:
        id_suscripcion: { type: integer }
        idcliente: { type: integer }
        idplan: { type: integer }
        precio: { type: number }
        estado:
          type: string
          enum: [Activa, Suspendida, Cancelada]
        activo: { type: boolean }
        renovacionautomatica: { type: boolean }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: string, format: date-time }
        motivocancelacion: { type: string, nullable: true }
        fechacancelacion: { type: string, format: date-time, nullable: true }

    SuscripcionDetalle:
      allOf:
        - $ref: "#/components/schemas/Suscripcion"
        - type: object
          properties:
            acceso_permitido: { type: boolean, description: RN-SUSF-017 }
            plan_nombre: { type: string }
            nivel: { type: string, enum: [Básico, Profesional, Empresarial] }

    SuscripcionEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Suscripcion" }
        meta: { type: object }

    SuscripcionDetalleEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/SuscripcionDetalle" }
        meta: { type: object }

    MetodoPagoRequest:
      type: object
      required: [tipo, datos_pasarela]
      properties:
        tipo:
          type: string
          enum: [tarjeta, transferencia, paypal]
        datos_pasarela:
          type: object
          description: Payload a tokenizar; nunca se re-persiste en crudo
          additionalProperties: true

    MetodoPago:
      type: object
      properties:
        idmetodopago: { type: integer }
        idcliente: { type: integer }
        tipo: { type: string }
        ultimosdigitos: { type: string, maxLength: 4 }
        fechaexpiracion: { type: string, nullable: true }
        activo: { type: boolean }

    MetodoPagoEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/MetodoPago" }
        meta:
          type: object
          properties:
            regularizacion_disparada: { type: boolean }

    MetodoPagoListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MetodoPago" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    SolicitudCambioPlanRequest:
      type: object
      required: [idplansolicitado, motivo]
      properties:
        idplansolicitado: { type: integer }
        motivo: { type: string, minLength: 1 }

    SolicitudCambioPlan:
      type: object
      properties:
        idsolicitud: { type: integer }
        idcliente: { type: integer }
        idplanactual: { type: integer }
        idplansolicitado: { type: integer }
        estado:
          type: string
          enum: [Pendiente, Aprobada, Rechazada]
        motivo: { type: string }
        motivo_rechazo: { type: string, nullable: true }
        idadminaprobador: { type: integer, nullable: true }
        fecha_solicitud: { type: string, format: date-time }
        fecha_resolucion: { type: string, format: date-time, nullable: true }

    SolicitudEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/SolicitudCambioPlan" }
        meta: { type: object }

    SolicitudListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SolicitudCambioPlan" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    PlanLimites:
      type: object
      required: [unidades_max, usuarios_max, api_calls_mes]
      properties:
        unidades_max: { type: integer, minimum: 0 }
        usuarios_max: { type: integer, minimum: 0 }
        api_calls_mes: { type: integer, minimum: 0 }

    PlanRequest:
      type: object
      required: [nombre, precio, limites, nivel]
      properties:
        nombre: { type: string }
        precio: { type: number, minimum: 0 }
        limites: { $ref: "#/components/schemas/PlanLimites" }
        nivel:
          type: string
          enum: [Básico, Profesional, Empresarial]

    PlanPatchRequest:
      type: object
      properties:
        nombre: { type: string }
        precio: { type: number, minimum: 0 }
        limites: { $ref: "#/components/schemas/PlanLimites" }
        nivel:
          type: string
          enum: [Básico, Profesional, Empresarial]
        activo: { type: boolean }

    Plan:
      type: object
      properties:
        idplan: { type: integer }
        nombre: { type: string }
        precio: { type: number }
        limites: { $ref: "#/components/schemas/PlanLimites" }
        nivel:
          type: string
          enum: [Básico, Profesional, Empresarial]
        activo: { type: boolean }

    PlanEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Plan" }
        meta: { type: object }

    PlanListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Plan" }
        meta: { type: object }

    Factura:
      type: object
      properties:
        id_factura: { type: string, format: uuid }
        id_cliente: { type: integer }
        id_suscripcion: { type: integer }
        idmetodopago: { type: integer, nullable: true }
        numero_factura: { type: string }
        periodo:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        estado_pago:
          type: string
          enum: [Pendiente, Pagada, Fallida]
        monto_base: { type: number }
        impuestos: { type: number }
        monto_total: { type: number }
        desglose_cargos:
          type: array
          items:
            type: object
            properties:
              concepto: { type: string }
              monto: { type: number }
        fecha_emision: { type: string, format: date-time }
        fecha_vencimiento: { type: string, format: date-time }
        reintentos: { type: integer }
        resultado_ultimo_reintento: { type: string, nullable: true }
        metodo_ultimosdigitos: { type: string, nullable: true }

    FacturaEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Factura" }
        meta: { type: object }

    FacturaListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Factura" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    RegularizacionEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            estado_pago:
              type: string
              enum: [Pagada, Fallida, Pendiente]
            estado_suscripcion:
              type: string
              enum: [Activa, Suspendida]
            resultado_ultimo_reintento: { type: string }
        meta: { type: object }
