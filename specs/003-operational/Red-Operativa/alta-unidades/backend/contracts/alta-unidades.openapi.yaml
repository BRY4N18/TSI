openapi: 3.0.3
info:
  title: TSI Alta y Configuración de Unidades de Emergencia API
  version: 1.3.0
  description: >
    Contrato contract-first (delta 2026-07-30): CU-O54/O56/O57/O58 para actor Proveedor.
    idcliente se resuelve del JWT (no en body). O54/O56 requieren gmail; create responde
    invitacion_enviada/invitacion_error (nunca password). Reenviar invitacion por unidad.
    List unidades: cursor/limit (default 20) + filtros q/activo/tipounidademergencia + meta.pagination.
    CU-O59 eliminado — disponibilidad solo vía CU-O30.
    Sigue api-standards.md del proyecto.
servers:
  - url: /api/v1
tags:
  - name: Unidades
paths:
  /red-operativa/unidades:
    get:
      tags: [Unidades]
      summary: Listar unidades de la flota del Proveedor (paginado + filtros)
      operationId: listUnidades
      description: >
        Devuelve una página de unidades del `idcliente` resuelto desde el JWT.
        Paginación por cursor (`idunidademergencia`). Default limit=20.
        Filtros: q (placa o nombre), activo, tipounidademergencia.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Último idunidademergencia de la página anterior (omitir en la primera)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Texto libre sobre placa o unidademergencia
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
          description: true=Activa, false=Baja; omitir=Todas
        - name: tipounidademergencia
          in: query
          required: false
          schema:
            type: string
            enum: [Ambulancia, Grúa, Patrulla, Bomberos, Defensa Civil]
      responses:
        '200':
          description: Página de catálogo
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        maxItems: 100
                        items:
                          $ref: '#/components/schemas/UnidadData'
                  meta:
                    type: object
                    required: [pagination]
                    properties:
                      pagination:
                        type: object
                        required: [next_cursor, limit]
                        properties:
                          next_cursor:
                            type: integer
                            nullable: true
                            description: idunidademergencia para la siguiente página; null si no hay más
                          limit:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Unidades]
      summary: Registrar una unidad de emergencia individual (CU-O54) — actor Proveedor; idcliente desde JWT
      operationId: createUnidad
      description: >
        El Proveedor autenticado registra una unidad. El idcliente se toma del token;
        si el body envía idcliente distinto, se ignora o se rechaza (403).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadCreateRequest'
      responses:
        '201':
          description: Unidad registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /red-operativa/unidades/importacion-lote:
    post:
      tags: [Unidades]
      summary: Registrar unidades en lote vía CSV (CU-O56) — incluye gmail + credenciales, todo-o-nada
      operationId: importUnidadesLote
      description: >
        Archivo CSV (columnas de alta individual más `gmail` por fila). Valida unidades y
        credenciales; si cualquier fila falla, insertadas=0 (ninguna unidad ni usuario activo).
        Max 500 filas. Requiere rol seed `Unidad`. Requiere además que el plan contratado del
        Proveedor habilite esta capacidad (`Fact_Suscripcion.carga_lote_habilitada`, corrección
        2026-08-08) — si no, 403 antes de leer el archivo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Importación procesada (todo-o-nada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacionLoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /red-operativa/unidades/{idunidademergencia}:
    get:
      tags: [Unidades]
      summary: Obtener detalle de una unidad
      operationId: getUnidad
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUnidad'
      responses:
        '200':
          description: Unidad obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Unidades]
      summary: Editar campos editables de una unidad existente (CU-O57)
      operationId: patchUnidad
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUnidad'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: confirmar_edicion_critica
          in: query
          required: false
          description: >
            Requerido en 'true' si la unidad tiene un despacho activo y se edita
            tipopropiedad o tipounidademergencia (RF-CAM-003).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadPatchRequest'
      responses:
        '200':
          description: Unidad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadUpdatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /red-operativa/unidades/{idunidademergencia}/baja:
    post:
      tags: [Unidades]
      summary: Dar de baja una unidad (CU-O58)
      description: >
        Autoservicio del Proveedor dueño, salvo con despacho activo: ahí la baja
        forzada (`forzar=true`) es exclusiva del Administrador (RF-O42.4,
        corrección 2026-08-08) — el Proveedor recibe 403 aunque envíe
        `forzar=true`; se le sugiere esperar el cierre del caso.
      operationId: bajaUnidad
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUnidad'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BajaUnidadRequest'
      responses:
        '200':
          description: Unidad dada de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BajaUnidadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /red-operativa/unidades/{idunidademergencia}/reactivar:
    post:
      tags: [Unidades]
      summary: Reactivar una unidad previamente dada de baja (CU-O58)
      operationId: reactivarUnidad
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUnidad'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unidad reactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe otra unidad activa con la misma placa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /red-operativa/unidades/{idunidademergencia}/invitacion/reenviar:
    post:
      tags: [Unidades]
      summary: Reenviar invitación SMTP de login de la unidad
      operationId: reenviarInvitacionUnidad
      description: >
        Regenera credencial temporal y reenvía correo. No incluye password en la respuesta.
        Si SMTP falla, invitacion_enviada=false e invitacion_error.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUnidad'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resultado del reenvío
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [idunidademergencia, idusuario, invitacion_enviada]
                    properties:
                      idunidademergencia:
                        type: integer
                      idusuario:
                        type: integer
                      invitacion_enviada:
                        type: boolean
                      invitacion_error:
                        type: string
                  meta:
                    type: object
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdUnidad:
      name: idunidademergencia
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Clave de idempotencia para operaciones de escritura

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Rol sin permiso para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Unidad no encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de negocio (placa duplicada o despacho activo sin confirmación)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error, detail, code]
      properties:
        error:
          type: string
        detail:
          type: string
        code:
          type: string

    UnidadData:
      type: object
      required:
        - idunidademergencia
        - idcliente
        - idcondado
        - tipopropiedad
        - placa
        - unidademergencia
        - tipounidademergencia
        - activo
      properties:
        idunidademergencia:
          type: integer
          readOnly: true
        idcliente:
          type: integer
        idcondado:
          type: integer
        tipopropiedad:
          type: string
          enum: [Propia, Externa]
        placa:
          type: string
        capacidad:
          type: string
          nullable: true
        contactoproveedor:
          type: string
          nullable: true
        unidademergencia:
          type: string
        tipounidademergencia:
          type: string
          enum: [Ambulancia, Grúa, Patrulla, Bomberos, Defensa Civil]
        idusuario:
          type: integer
          nullable: true
          description: Login de la unidad (CU-O30); se liga en O56
        activo:
          type: boolean
        latitud:
          type: number
          format: float
          nullable: true
        longitud:
          type: number
          format: float
          nullable: true

    UnidadResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UnidadData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeMeta:
      type: object
      properties:
        pagination:
          type: object
          nullable: true

    UnidadCreateRequest:
      type: object
      required:
        - idcondado
        - tipopropiedad
        - placa
        - unidademergencia
        - tipounidademergencia
      properties:
        idcliente:
          type: integer
          deprecated: true
          description: Ignorado — se resuelve del JWT del Proveedor
        idcondado:
          type: integer
        tipopropiedad:
          type: string
          enum: [Propia, Externa]
          default: Externa
        placa:
          type: string
        capacidad:
          type: string
        contactoproveedor:
          type: string
          description: Requerido si tipopropiedad = Externa
        unidademergencia:
          type: string
        tipounidademergencia:
          type: string
          enum: [Ambulancia, Grúa, Patrulla, Bomberos, Defensa Civil]
        gmail:
          type: string
          format: email
          description: >
            Opcional en O54 (corrección 2026-08-08, SRS 3.5.1). Si se envía,
            crea login rol Unidad, credencial temporal, liga idusuario e invita
            por correo (habilita CU-O30). Si se omite, la unidad queda en el
            catálogo sin acceso propio hasta que se le asigne login después.
        activo:
          type: boolean
          default: true

    UnidadCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [idunidademergencia, placa, activo, invitacion_enviada]
          properties:
            idunidademergencia:
              type: integer
            placa:
              type: string
            activo:
              type: boolean
            idusuario:
              type: integer
            usuario_creado:
              type: boolean
            invitacion_enviada:
              type: boolean
              description: true si SMTP entregó la invitación con credenciales
            invitacion_error:
              type: string
              description: Presente si invitacion_enviada=false; nunca incluye password

    UnidadPatchRequest:
      type: object
      minProperties: 1
      properties:
        tipopropiedad:
          type: string
          enum: [Propia, Externa]
        capacidad:
          type: string
        idcondado:
          type: integer
        contactoproveedor:
          type: string
        unidademergencia:
          type: string
        tipounidademergencia:
          type: string
          enum: [Ambulancia, Grúa, Patrulla, Bomberos, Defensa Civil]
        latitud:
          type: number
          format: float
        longitud:
          type: number
          format: float

    UnidadUpdatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [idunidademergencia, campos_modificados]
          properties:
            idunidademergencia:
              type: integer
            campos_modificados:
              type: array
              items:
                type: string

    ImportacionLoteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [insertadas, fallidas]
          properties:
            insertadas:
              type: integer
            fallidas:
              type: array
              items:
                type: object
                required: [fila, motivo]
                properties:
                  fila:
                    type: integer
                  motivo:
                    type: string
            usuarios_creados:
              type: integer
              description: Igual a insertadas en lote exitoso; 0 si falló alguna credencial

    BajaUnidadRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
        forzar:
          type: boolean
          default: false
          description: >
            Requerido en 'true' si la unidad tiene un despacho activo en curso —
            y solo entonces surte efecto si además el rol del solicitante es
            Administrador; enviado por un Proveedor devuelve 403 igual (RF-O42.4).

    BajaUnidadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [idunidademergencia, activo]
          properties:
            idunidademergencia:
              type: integer
            activo:
              type: boolean
              enum: [false]
