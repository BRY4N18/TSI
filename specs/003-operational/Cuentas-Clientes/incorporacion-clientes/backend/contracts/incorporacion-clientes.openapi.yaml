openapi: 3.0.3
info:
  title: TSI Incorporación de Clientes API
  version: 1.2.0
  description: >
    Numeración de CU corregida 2026-08-08 al catálogo vigente (TSI-Catalogo-CU-RF-RNF.md).
    Contrato (2026-07-25): CU-O09 autorregistro, CU-O10 aprobar/rechazar/anular,
    CU-O11 onboarding (incluye RF-O11.2 guardar progreso; logo cliente), CU-O12 reenviar invitación.
    Registro directo y config. plan+logo (legado, sin CU vigente) retirados (HTTP 410) —
    no confundir con el CU-O12 vigente de arriba. Plan → Suscripciones.
servers:
  - url: /api/v1
tags:
  - name: Autorregistro
  - name: Aprobacion
  - name: Onboarding
  - name: Invitacion
  - name: Logo
  - name: Retirado
    description: Registro directo / config. plan+logo (legado, sin CU vigente) — responden 410 Gone
paths:
  /cuentas-clientes/autorregistro:
    post:
      tags: [Autorregistro]
      summary: Autorregistro (CU-O09) — estado Pendiente_Aprobación
      operationId: autorregistrarProveedor
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutorregistroProveedorRequest'
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutorregistroProveedorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /cuentas-clientes/solicitudes:
    get:
      tags: [Aprobacion]
      summary: Listar solicitudes Pendiente_Aprobación o Rechazado (CU-O10)
      operationId: listarSolicitudesProveedor
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [Pendiente_Aprobación, Rechazado]
            default: Pendiente_Aprobación
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cuentas-clientes/{idcliente}/aprobacion:
    post:
      tags: [Aprobacion]
      summary: Aprobar o rechazar solicitud (CU-O10)
      operationId: decidirSolicitudProveedor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AprobacionRequest'
      responses:
        '200':
          description: Decisión aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AprobacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cuentas-clientes/{idcliente}/anular-rechazo:
    post:
      tags: [Aprobacion]
      summary: Soft-anular Rechazado → Rechazado_Anulado (libera NIT para nuevo O09)
      operationId: anularRechazoProveedor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rechazo anulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AprobacionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cuentas-clientes:
    post:
      tags: [Retirado]
      deprecated: true
      summary: "[RETIRADO] Registro directo (legado, sin CU vigente) — responde 410 Gone"
      operationId: registrarCuentaCliente
      security:
        - bearerAuth: []
      responses:
        '410':
          description: Endpoint retirado — usar autorregistro CU-O09 + aprobación CU-O10

  /cuentas-clientes/{idcliente}/configuracion:
    patch:
      tags: [Retirado]
      deprecated: true
      summary: "[RETIRADO] Config. plan+logo (legado, sin CU vigente) — responde 410 Gone"
      operationId: configurarCuentaCliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
      responses:
        '410':
          description: Endpoint retirado — logo cliente; plan en Suscripciones

  /cuentas-clientes/{idcliente}/logo/upload-url:
    post:
      tags: [Logo]
      summary: URL firmada para subir logo (cliente en onboarding CU-O11 / perfil — no Admin)
      operationId: createOnboardingLogoUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoUploadUrlRequest'
      responses:
        '200':
          description: URL firmada generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoUploadUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cuentas-clientes/{idcliente}/onboarding/progreso:
    get:
      tags: [Onboarding]
      summary: Consultar progreso y etapa actual del onboarding (CU-O11, RF-O11.2)
      operationId: getOnboardingProgreso
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
      responses:
        '200':
          description: Progreso actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgresoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cuentas-clientes/{idcliente}/onboarding/etapas:
    post:
      tags: [Onboarding]
      summary: Completar una etapa del onboarding digital (CU-O11)
      operationId: completarOnboardingEtapa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletarEtapaRequest'
      responses:
        '200':
          description: Etapa completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletarEtapaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cuentas-clientes/{idcliente}/invitacion/reenviar:
    post:
      tags: [Invitacion]
      summary: Reenviar invitación con contraseña temporal (CU-O12)
      operationId: reenviarInvitacion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdCliente'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenviarInvitacionRequest'
      responses:
        '200':
          description: Invitación reenviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReenviarInvitacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdCliente:
      name: idcliente
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Clave de idempotencia para operaciones de escritura

  schemas:
    EnvelopeMeta:
      type: object
      properties:
        pagination:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      required: [error, detail, code]
      properties:
        error:
          type: string
        detail:
          type: string
        code:
          type: string

    TipoCliente:
      type: string
      enum: [Proveedor, Aseguradora, Municipio, Smart City]

    EstadoCuenta:
      type: string
      enum: [Pendiente_Aprobación, Activo, Rechazado, Rechazado_Anulado, Dado de baja]

    EstadoOnboarding:
      type: string
      enum: [Pendiente, En progreso, Completado]

    EtapaOnboarding:
      type: string
      enum: [cambio_password, perfil_corporativo, preferencias]

    AdminLocalInput:
      type: object
      required: [nombres, apellidos, gmail]
      properties:
        nombres:
          type: string
          minLength: 1
        apellidos:
          type: string
          minLength: 1
        gmail:
          type: string
          format: email

    AutorregistroProveedorRequest:
      type: object
      required:
        - razon_social
        - nombre
        - tipo
        - nit_identificacion
        - admin_local
      properties:
        razon_social:
          type: string
          minLength: 2
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoCliente'
          description: Canónico Proveedor para este flujo
        nit_identificacion:
          type: string
        fecha_inicio_contrato:
          type: integer
          format: int64
          nullable: true
          description: Epoch ms opcional en solicitud
        admin_local:
          $ref: '#/components/schemas/AdminLocalInput'

    AutorregistroProveedorData:
      type: object
      required: [idcliente, estado, admin_local_id, admin_local_gmail]
      properties:
        idcliente:
          type: integer
        estado:
          type: string
          enum: [Pendiente_Aprobación]
        admin_local_id:
          type: integer
        admin_local_gmail:
          type: string
          format: email
        message:
          type: string
          example: Solicitud en revisión

    AutorregistroProveedorResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AutorregistroProveedorData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    SolicitudItem:
      type: object
      required: [idcliente, razon_social, nit_identificacion, estado, tipo]
      properties:
        idcliente:
          type: integer
        razon_social:
          type: string
        nit_identificacion:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoCliente'
        estado:
          type: string
          enum: [Pendiente_Aprobación]

    SolicitudesListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudItem'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    AprobacionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [aprobar, rechazar]
        motivo:
          type: string
          description: Requerido si decision=rechazar

    AprobacionData:
      type: object
      required: [idcliente, estado]
      properties:
        idcliente:
          type: integer
        estado:
          type: string
          enum: [Activo, Rechazado, Rechazado_Anulado]
        estado_onboarding:
          allOf:
            - $ref: '#/components/schemas/EstadoOnboarding'
          nullable: true
          description: Pendiente si aprobado; null si rechazado

    AprobacionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AprobacionData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    RegistroCuentaRequest:
      type: object
      required:
        - razon_social
        - nombre
        - tipo
        - nit_identificacion
        - fecha_inicio_contrato
        - admin_local
      properties:
        razon_social:
          type: string
          minLength: 2
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoCliente'
        nit_identificacion:
          type: string
        fecha_inicio_contrato:
          type: integer
          format: int64
          description: Epoch milliseconds
        admin_local:
          $ref: '#/components/schemas/AdminLocalInput'

    RegistroCuentaData:
      type: object
      required:
        - idcliente
        - estado
        - admin_local_id
        - admin_local_gmail
      properties:
        idcliente:
          type: integer
        estado:
          type: string
          enum: [Activo]
        admin_local_id:
          type: integer
        admin_local_gmail:
          type: string
          format: email
        message:
          type: string
          example: Cuenta creada

    RegistroCuentaResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RegistroCuentaData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    ConfiguracionCuentaRequest:
      type: object
      required: [plan_suscripcion]
      properties:
        plan_suscripcion:
          type: string
        logo_url:
          type: string
          format: uri

    ConfiguracionCuentaData:
      type: object
      required:
        - idcliente
        - plan_suscripcion
        - estado_onboarding
      properties:
        idcliente:
          type: integer
        plan_suscripcion:
          type: string
        logo_url:
          type: string
          format: uri
          nullable: true
        estado_onboarding:
          $ref: '#/components/schemas/EstadoOnboarding'

    ConfiguracionCuentaResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConfiguracionCuentaData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    OnboardingProgresoData:
      type: object
      required:
        - idcliente
        - estado_onboarding
        - etapas_completadas
        - etapa_actual
      properties:
        idcliente:
          type: integer
        estado_onboarding:
          $ref: '#/components/schemas/EstadoOnboarding'
        etapas_completadas:
          type: array
          items:
            $ref: '#/components/schemas/EtapaOnboarding'
        etapa_actual:
          allOf:
            - $ref: '#/components/schemas/EtapaOnboarding'
          nullable: true
          description: null si onboarding Completado

    OnboardingProgresoResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/OnboardingProgresoData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    DatosEtapaPerfil:
      type: object
      properties:
        razon_social:
          type: string
          minLength: 2
        nombre:
          type: string
        logo_url:
          type: string
          format: uri
      minProperties: 1

    DatosEtapaPreferencias:
      type: object
      properties:
        umbrales_alerta:
          type: string
        canales_notificacion:
          type: string
          enum: [email, sms, ambos]
        telefono_sms:
          type: string
        zonas_geograficas:
          type: string
        destinatarios_reportes:
          type: string
        frecuencia_reportes:
          type: string
        formato_reportes:
          type: string
      minProperties: 1

    CompletarEtapaRequest:
      type: object
      required: [etapa]
      properties:
        etapa:
          $ref: '#/components/schemas/EtapaOnboarding'
        datos_etapa:
          description: >
            Requerido para perfil_corporativo y preferencias.
            Para cambio_password puede omitirse si la credencial ya está en estadocredencial Activo.
          oneOf:
            - $ref: '#/components/schemas/DatosEtapaPerfil'
            - $ref: '#/components/schemas/DatosEtapaPreferencias'

    CompletarEtapaData:
      type: object
      required:
        - etapa
        - progreso
      properties:
        etapa:
          $ref: '#/components/schemas/EtapaOnboarding'
        progreso:
          $ref: '#/components/schemas/OnboardingProgresoData'

    CompletarEtapaResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CompletarEtapaData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    ReenviarInvitacionRequest:
      type: object
      properties:
        id_usuario:
          type: integer
          minimum: 1
          description: Default admin_local_id si omitido (Cliente)

    ReenviarInvitacionData:
      type: object
      required: [message, id_usuario]
      properties:
        message:
          type: string
          example: Invitación reenviada
        id_usuario:
          type: integer

    ReenviarInvitacionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ReenviarInvitacionData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    LogoUploadUrlRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        file_name:
          type: string
          maxLength: 255

    LogoUploadUrlData:
      type: object
      required: [upload_url, logo_url, expires_at]
      properties:
        upload_url:
          type: string
          format: uri
        logo_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    LogoUploadUrlResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LogoUploadUrlData'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permisos insuficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de estado o duplicado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
