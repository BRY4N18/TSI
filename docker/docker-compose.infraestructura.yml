name: infraestructura

networks:
  pipeline-net:
    name: pipeline-net
    driver: bridge

services:

  # ─────────────────────────────────────────
  # ZOOKEEPER
  # ─────────────────────────────────────────
  zookeeper:
    image: zookeeper:3.8.4
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Zookeeper || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pipeline-net
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog

  # ─────────────────────────────────────────
  # KAFKA
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - pipeline-net
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ─────────────────────────────────────────
  # APACHE PINOT
  # ─────────────────────────────────────────
  pinot-controller:
    image: apachepinot/pinot:1.2.0
    command: "StartController -controllerHost pinot-controller -controllerPort 9000 -zkAddress zookeeper:2181"
    container_name: pinot-controller
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - pipeline-net
    volumes:
      - pinot-controller-data:/tmp/data

  pinot-broker:
    image: apachepinot/pinot:1.2.0
    command: "StartBroker -brokerHost pinot-broker -brokerPort 8099 -zkAddress zookeeper:2181"
    container_name: pinot-broker
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8099/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      pinot-controller:
        condition: service_healthy
    networks:
      - pipeline-net

  pinot-server:
    image: apachepinot/pinot:1.2.0
    command: "StartServer -serverHost pinot-server -serverPort 8098 -zkAddress zookeeper:2181"
    container_name: pinot-server
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      # Dimensionado para `Fact_Accidente` con 2 000 013 filas. Con -Xmx2G en
      # 4g, el servidor se caia en mitad de la carga del hecho de accidentes:
      # cada pagina recorre y ordena los 2M para devolver su trozo, y la
      # presion se acumula entre paginas. Reducir el tamano de pagina no bastó
      # -tambien murio con 50 000-, asi que el que se quedaba corto era él.
      #
      # ⚠️ El sintoma engaña: el broker responde `Connection refused` y parece
      # un problema de red del contenedor, no falta de memoria.
      #
      # `MaxDirectMemorySize` va aparte del heap: los segmentos se mapean fuera
      # de el, asi que 3G + 2G + margen del JVM es lo que sostiene el limite.
      JAVA_OPTS: "-Xms2G -Xmx3G -XX:MaxDirectMemorySize=2G"
    mem_limit: 6g
    mem_reservation: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8097/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      pinot-broker:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pipeline-net
    volumes:
      - pinot-server-data:/tmp/data

volumes:
  zookeeper-data:
  zookeeper-datalog:
  kafka-data:
  pinot-controller-data:
  pinot-server-data:
