name: accidentes

services:
  osrm:
    image: osrm/osrm-backend
    container_name: accidentes-osrm
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./osrm/data:/data
    networks:
      - pipeline-net
    restart: unless-stopped

  django:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: accidentes-django
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      # El catálogo de consultas de los informes compuestos. Vive en `dags/`
      # junto al modelo que consulta —esa es la decisión del plan— y Django lo
      # **lee**, en solo lectura: el único escritor del almacén sigue siendo
      # Airflow. Copiarlo al backend habría dejado dos copias divergiendo, que es
      # justo el fallo que este módulo sustituye.
      - ../dags/lib/consultas:/opt/consultas:ro
    environment:
      CONSULTAS_DIR: /opt/consultas
    depends_on:
      - osrm
    networks:
      - pipeline-net
    restart: unless-stopped

  # Worker de consumo de Kafka del despacho (B27). Sin este proceso, la
  # asignación automática al reportarse un accidente y la reasignación al
  # vencer un despacho no se ejecutan nunca. Va aparte de `django` a
  # propósito: el autoreloader de runserver duplicaría el consumidor y un
  # fallo del bucle no debe tumbar la API. La supervisión es `restart`.
  despacho-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: accidentes-despacho-worker
    command: python manage.py run_kafka_consumers
    env_file:
      - ../backend/.env
    environment:
      # Sin esto la salida queda en el buffer y `docker logs` no muestra nada:
      # el worker no tiene pantalla, sus registros son la única forma de verlo.
      PYTHONUNBUFFERED: "1"
    depends_on:
      - django
    networks:
      - pipeline-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: accidentes-frontend
    ports:
      - "4200:80"
    depends_on:
      - django
    networks:
      - pipeline-net
    restart: unless-stopped

networks:
  pipeline-net:
    external: true
