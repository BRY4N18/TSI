server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (PG-SEC-008) ---
    #
    # `always` no es opcional: sin el, nginx omite la cabecera en las respuestas
    # de error (4xx/5xx), que son justo las que un atacante provoca a proposito.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # CSP. `unsafe-inline` en estilos es una concesion a Angular, que inyecta
    # estilos por componente; en `script-src` **no** se concede, que es donde
    # importa. `connect-src` incluye 'self' para la API y el canal SSE.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/seguimiento/stream, despacho/stream): sin esto nginx bufferiza
        # y cierra el stream tras el primer chunk → UI queda en "Conectando…".
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so the browser picks up new
    # content-hashed chunk filenames after every deploy; otherwise a stale
    # cached index.html references chunks that no longer exist post-rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Content-hashed build artifacts (main-*.js, chunk-*.js, styles-*.css)
    # are safe to cache aggressively since their filename changes whenever
    # their content does.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
