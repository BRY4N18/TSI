<div class="flex min-h-0 flex-1 flex-col gap-4 p-6 lg:p-8" data-testid="preferencias-cuenta">
  <a
    routerLink="/cuentas-clientes/gestion-cuenta"
    class="inline-flex w-fit items-center gap-1 text-sm font-medium text-accent-primary no-underline hover:underline"
  >
    Volver a gestión
  </a>

  <h1 class="m-0 text-2xl font-bold text-text-primary">Preferencias operativas</h1>
  <p class="m-0 text-sm text-text-secondary">Cliente #{{ idcliente }}</p>

  @if (mensaje) {
    <p class="m-0 text-sm text-accent-primary">{{ mensaje }}</p>
  }
  @if (error) {
    <p class="m-0 text-sm text-alert-critical">{{ error }}</p>
  }

  @if (preferencias) {
    <form class="grid max-w-md gap-3 rounded-lg border border-border-default bg-bg-surface p-4" (ngSubmit)="guardar()">
      <label class="grid gap-1 text-sm font-medium text-text-secondary">
        Teléfono SMS
        <input class="tsi-input" [(ngModel)]="preferencias.telefono_sms" name="telefono_sms" />
      </label>
      <label class="grid gap-1 text-sm font-medium text-text-secondary">
        Canales de notificación
        <input class="tsi-input" [(ngModel)]="preferencias.canales_notificacion" name="canales" />
      </label>
      <button type="submit" class="tsi-btn tsi-btn-primary w-fit">Guardar</button>
    </form>
  }
</div>
